services:
  prometheus:
    image: prom/prometheus:latest
    container_name: desi-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring, desi-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: desi-grafana
    # Bind 0.0.0.0 để truy cập qua IP server. Các exporter và Prometheus vẫn
    # giữ 127.0.0.1 để giảm bề mặt tấn công — debug Prometheus qua SSH tunnel.
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [monitoring]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: desi-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: desi-cadvisor
    # Cùng lý do với docker-compose.prod.yml: Docker dùng containerd snapshotter
    # thì cadvisor không tra được rw-layer (chỉ cần cho metric disk) và bỏ rơi
    # mọi container → allowlist bỏ "disk".
    command:
      - --enable_metrics=cpu,memory,network,diskIO,oom_event
      - --docker_only=true
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    networks: [monitoring]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: desi-redis-exporter
    environment:
      # Dùng container DNS qua desi-net thay vì host.docker.internal vì Redis
      # thường bind chỉ 127.0.0.1 trên host → host-gateway từ container không tới.
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:9121:9121"
    networks: [monitoring, desi-net]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: desi-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-desi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-desi}?sslmode=disable
      - PG_EXPORTER_AUTO_DISCOVER_DATABASES=true
    ports:
      - "127.0.0.1:9187:9187"
    networks: [monitoring, desi-net]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: desi-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks: [monitoring]
    restart: unless-stopped

  # alertmanager.yml trỏ receiver vào host `lark-alert-adapter` → stack này phải
  # có service đó, nếu không alert sẽ lỗi DNS. Giữ khớp với docker-compose.prod.yml.
  # (Lý do cần adapter: payload Alertmanager không đúng định dạng Lark custom bot —
  # xem monitoring/lark_alert_adapter.py.)
  lark-alert-adapter:
    image: public.ecr.aws/docker/library/python:3.13-slim
    container_name: desi-lark-alert-adapter
    environment:
      LARK_ALERT_WEBHOOK_URL: ${LARK_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./lark_alert_adapter.py:/app/lark_alert_adapter.py:ro
    command: ["python", "/app/lark_alert_adapter.py"]
    expose: ["9095"]
    mem_limit: 128m
    networks: [monitoring]
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2  # pin 2026-07-03
    container_name: desi-celery-exporter
    environment:
      # Trỏ vào Redis broker (DB 3) — khớp REDIS_CELERY_BROKER_DB của app.
      - CE_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/3
    ports:
      - "127.0.0.1:9808:9808"
    networks: [monitoring, desi-net]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  # External network các app service đang chạy. Prometheus join vào để scrape
  # Go services (task-worker/task-cron/audit-writer :2112) + desi-web:8000 qua
  # container DNS. Tên network khác giữa môi trường:
  #   - prod (docker-compose.prod.yml): desi-order_default  ← default
  #   - local (docker-compose.local.yml): desi-order_desi-net
  # Override bằng DESI_NET_NAME nếu compose project name khác.
  desi-net:
    name: ${DESI_NET_NAME:-desi-order_default}
    external: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
