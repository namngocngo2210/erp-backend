global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: desi-order
    env: ${APP_ENV}

rule_files:
  - /etc/prometheus/alerts.yml

# Đẩy alert sang Alertmanager (service `alertmanager` trong docker-compose.prod.yml,
# profile monitoring). Không có Alertmanager thì rule vẫn evaluate nhưng alert
# chỉ hiện trên UI Prometheus — pipeline này nối lại chỗ đứt gãy (audit 2026-07).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host header của scrape này là "web:8000" ⇒ DJANGO_ALLOWED_HOSTS phải chứa
  # "web", nếu không Django trả 400 DisallowedHost và job này down.
  - job_name: desi-backend
    metrics_path: /api/orders/metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          component: backend
          process: web

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [container_label_com_docker_compose_project]
        target_label: project

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: redis

  # Instance cache tách riêng từ 2026-08-11 (docs/cache-latency-optimization-2026-08-11.md).
  # Label `component` khác để phân biệt trên Grafana: cache đầy rồi evict là BÌNH
  # THƯỜNG (allkeys-lru), còn broker mà evict là mất job — hai thứ không được lẫn.
  - job_name: redis-cache-exporter
    static_configs:
      - targets: ["redis-cache-exporter:9121"]
        labels:
          component: redis-cache

  # Queue length Celery (rule CeleryQueueBacklog cần data này).
  - job_name: celery-exporter
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          component: celery

  # Log pipeline (Loki + Alloy) — scrape để TargetDown phủ luôn 2 service này.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: logging

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          component: logging

