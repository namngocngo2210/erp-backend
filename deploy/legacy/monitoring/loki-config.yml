# Loki single-binary (docs/ops-hardening-2026-07.md) — log tập trung cho các
# container prod. Storage filesystem trên volume loki_data, retention 14 ngày
# (compactor). Chỉ nghe trong network desi-net, không expose ra host.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Log của chính Loki giữ mức warn cho đỡ ồn (nó cũng bị Alloy thu lại).
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 ngày — đủ điều tra sự cố; disk VPS có hạn (Prometheus đã giữ 30d metric).
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Log backend là JSON 1 dòng; 256KB/line là quá đủ, chặn payload bất thường.
  max_line_size: 256KB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
