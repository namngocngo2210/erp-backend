# Default vhost — dev mode (no SSL, no domain). Pin tất cả host khác về frontend/web.
# Khi deploy customer.delax.vn (qua nginx/conf.d/customer.delax.vn.conf), vhost
# này vẫn handle các request không khớp Host header (CDN probe, IP scan, ...).

server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── Đăng nhập + refresh token: zone riêng, chặt hơn /api/ chung ──
  # Regex (không phải `location =`) để bắt cả biến thể có dấu / ở cuối. Đứng
  # trước `location /api/` chỉ để dễ đọc — nginx ưu tiên regex hơn prefix nên
  # thứ tự với block đó không quan trọng, nhưng thứ tự GIỮA CÁC REGEX thì có.
  location ~ ^/api/users/(login|token/refresh)/?$ {
    limit_req zone=desi_api_auth burst=20 nodelay;
    set $backend_upstream http://web:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/orders/ingest/?$ {
    # Zone riêng, rộng: landing page đẩy đơn theo cụm, chặn nhầm = mất đơn thật.
    limit_req zone=desi_api_ingest burst=60 nodelay;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, X-Api-Token" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
    set $backend_upstream http://web:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Prometheus metrics — CHỈ mạng nội bộ. Endpoint là AllowAny theo đúng quy ước
  # Prometheus (metrics_view.py không thể đòi JWT vì scraper không có), nên việc
  # chặn nằm ở tầng này. File nginx của host (customer.delax.vn.conf.prod-template)
  # đã có block này từ trước, còn file trong container thì thiếu — mọi môi trường
  # dùng file này đều phơi metrics ra internet (audit 2026-07-26 C3).
  # Phải đứng TRƯỚC `location /api/`: nginx ưu tiên `location =` nên thứ tự không
  # bắt buộc, nhưng đặt cạnh nhau để người sửa sau không tách rời hai khối.
  location = /api/orders/metrics {
    set $backend_upstream http://web:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;
  }

  # API Daily Report (trợ lý trên Mac mini). Bật khối này khi Mac mini có IP cố
  # định qua Tailscale/VPN tới VPS — thay <TAILSCALE_IP>. Ngoài allowlist: 404
  # (giống cách gate docs), không phải 403, để không lộ sự tồn tại của endpoint.
  # location ^~ /api/daily-report/ {
  #     allow <TAILSCALE_IP>;
  #     deny all;
  #     error_page 403 =404 /404.html;
  #     limit_req zone=desi_api_general burst=20 nodelay;
  #     set $backend_upstream http://web:8000;
  #     proxy_pass $backend_upstream;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_read_timeout 300s;
  #     proxy_send_timeout 300s;
  # }

  location /api/ {
    # Trần chung cho REST API. burst=40 nodelay: mở một trang ERP bắn ~10-20
    # request cùng lúc — burst hấp thụ cụm đó, rate 20r/s chặn luồng duy trì.
    # `nodelay` để request trong burst đi NGAY (xếp hàng sẽ làm UI giật).
    limit_req zone=desi_api_general burst=40 nodelay;
    set $backend_upstream http://web:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Mặc định của nginx là 60s. Hai endpoint HR (bảng lương / chấm công tháng) vẫn
    # chạy đồng bộ theo chủ đích (xem docs/superpowers/specs/2026-08-06-async-export-jobs-design.md
    # mục 2), và các báo cáo nặng khác cũng vượt 60s khi kỳ lọc rộng — 60s là quả mìn
    # hẹn giờ, không phải hàng rào bảo vệ.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # /ws/ CỐ Ý không giới hạn: WebSocket là kết nối dài (limit_req vô nghĩa) và
  # limit_conn sẽ cắt nhầm khi cả văn phòng ra internet chung một IP NAT.
  location /ws/ {
    set $backend_upstream http://web:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /assets/ {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
  }

  location / {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
  }

  location = /nginx_status {
    stub_status;
    access_log off;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
  }
}
