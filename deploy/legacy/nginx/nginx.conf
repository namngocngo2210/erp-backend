events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_vary on;
  # Mặc định nginx là `gzip_proxied off` — KHÔNG nén response đến từ proxy_pass,
  # tức toàn bộ JSON của API. Xem audit cache/latency 2026-08-11 §2.4: nén đang do
  # zlib của Python làm, trong container web vốn đã thiếu CPU. Bật dòng này chưa
  # đổi gì khi Django còn nén (response đã có Content-Encoding thì nginx bỏ qua);
  # đây là bước 1 của cutover, bước 2 là đặt WEB_GZIP_IN_DJANGO=0.
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Rate limiting ──────────────────────────────────────────────────────────
  # Bản sao của nginx/rate-limit-zones.conf.example (file đó dành cho HOST nginx
  # ở prod/staging; block này cho nginx CONTAINER dùng ở local). Sửa một bên thì
  # sửa cả hai — cơ sở chọn số ở docs/rate-limiting-hardening-2026-07.md §3.1.
  #
  # Key = IP client thật: CF-Connecting-IP (Cloudflare set, không giả được) →
  # địa chỉ TCP. KHÔNG dùng X-Forwarded-For vì client tự đặt được.
  map $http_cf_connecting_ip $desi_rl_key {
    default $http_cf_connecting_ip;
    ''      $binary_remote_addr;
  }

  limit_req_zone $desi_rl_key zone=desi_api_general:10m rate=20r/s;
  limit_req_zone $desi_rl_key zone=desi_api_auth:5m rate=60r/m;
  limit_req_zone $desi_rl_key zone=desi_api_ingest:5m rate=30r/s;
  limit_req_zone $desi_rl_key zone=desi_portal:10m rate=10r/m;
  # Ảnh sản phẩm trang /sp/ (delax.com.vn) — zone riêng, rộng hơn desi_portal.
  # Xem giải thích ở nginx/rate-limit-zones.conf.example.
  limit_req_zone $desi_rl_key zone=desi_portal_media:10m rate=120r/m;

  # nginx mặc định trả 503; 429 mới đúng ngữ nghĩa và khớp DRF ở tầng app.
  limit_req_status 429;
  limit_req_log_level warn;

  include /etc/nginx/conf.d/*.conf;
}
