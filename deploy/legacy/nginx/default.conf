events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_vary on;
  # Nén cả response từ proxy_pass (JSON của API). Xem ghi chú đầy đủ ở
  # nginx/nginx.conf và audit cache/latency 2026-08-11 §2.4.
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Rate limiting (xem nginx/rate-limit-zones.conf.example + nginx/nginx.conf,
  #    giữ ba nơi này đồng bộ; cơ sở chọn số ở
  #    docs/rate-limiting-hardening-2026-07.md §3.1) ──
  map $http_cf_connecting_ip $desi_rl_key {
    default $http_cf_connecting_ip;
    ''      $binary_remote_addr;
  }

  limit_req_zone $desi_rl_key zone=desi_api_general:10m rate=20r/s;
  limit_req_zone $desi_rl_key zone=desi_api_auth:5m rate=60r/m;
  limit_req_zone $desi_rl_key zone=desi_api_ingest:5m rate=30r/s;
  limit_req_zone $desi_rl_key zone=desi_portal:10m rate=10r/m;
  # Ảnh sản phẩm trang /sp/ (delax.com.vn) — zone riêng, rộng hơn desi_portal.
  # Xem giải thích ở nginx/rate-limit-zones.conf.example.
  limit_req_zone $desi_rl_key zone=desi_portal_media:10m rate=120r/m;

  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 80;
    server_name _;

    location ~ ^/api/users/(login|token/refresh)/?$ {
      limit_req zone=desi_api_auth burst=20 nodelay;
      set $backend_upstream http://web:8000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/orders/ingest/ {
      limit_req zone=desi_api_ingest burst=60 nodelay;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Api-Token" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, X-Api-Token" always;
      set $backend_upstream http://web:8000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Daily Report (trợ lý trên Mac mini). Bật khối này khi Mac mini có IP cố
    # định qua Tailscale/VPN tới VPS — thay <TAILSCALE_IP>. Ngoài allowlist: 404
    # (giống cách gate docs), không phải 403, để không lộ sự tồn tại của endpoint.
    # location ^~ /api/daily-report/ {
    #     allow <TAILSCALE_IP>;
    #     deny all;
    #     error_page 403 =404 /404.html;
    #     limit_req zone=desi_api_general burst=20 nodelay;
    #     set $backend_upstream http://web:8000;
    #     proxy_pass $backend_upstream;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    #     proxy_send_timeout 300s;
    # }

    location /api/ {
      limit_req zone=desi_api_general burst=40 nodelay;
      set $backend_upstream http://web:8000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Mặc định của nginx là 60s. Hai endpoint HR (bảng lương / chấm công tháng) vẫn
      # chạy đồng bộ theo chủ đích (xem docs/superpowers/specs/2026-08-06-async-export-jobs-design.md
      # mục 2), và các báo cáo nặng khác cũng vượt 60s khi kỳ lọc rộng — 60s là quả mìn
      # hẹn giờ, không phải hàng rào bảo vệ.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /ws/ {
      set $backend_upstream http://web:8000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /assets/ {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exposed only on the Docker internal network for nginx-exporter.
    location = /nginx_status {
      stub_status;
      access_log off;
      allow 172.16.0.0/12;
      allow 10.0.0.0/8;
      allow 192.168.0.0/16;
      allow 127.0.0.1;
      deny all;
    }
  }
}
