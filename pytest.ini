[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = apps
markers =
    slow: test đắt (migrate scratch DB, seed thật, race thread có chờ) — CI vẫn chạy đủ; local: -m "not slow"
    no_resale_staff: test job resale Foxia tự dựng cấu hình cột resale (bỏ fixture mặc định)
